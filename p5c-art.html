<!doctype html>
<html lang="zh-CN" data-theme="p5">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2ECE0">
<title>夜行 · 造像</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/p5hub.css">
<link rel="stylesheet" href="../assets/story.css">
<link rel="stylesheet" href="../assets/xz.css">
</head>
<body class="page" data-i="5">
<a class="skip-link" href="#main">跳到正文</a>
<main id="main" class="act artgen">
  <a class="back" href="p5-follow.html">← 同行</a>
  <p class="cap">造像</p>
  <h1>画一张</h1>
  <p class="lead">选一个地方。AI 决定画面，本站画出来。</p>
  <p class="off" id="off" hidden>没有接 API。以下是离线版，基础功能都能用。</p>

  <form id="af" class="sf" autocomplete="off" novalidate>
    <div class="sf__in">
      <fieldset class="chips">
        <legend>画哪儿</legend>
        <label><input type="radio" name="p" value="于都" checked><span>于都</span></label>
        <label><input type="radio" name="p" value="湘江"><span>湘江</span></label>
        <label><input type="radio" name="p" value="遵义"><span>遵义</span></label>
        <label><input type="radio" name="p" value="泸定桥"><span>泸定桥</span></label>
        <label><input type="radio" name="p" value="夹金山"><span>夹金山</span></label>
        <label><input type="radio" name="p" value="草地"><span>草地</span></label>
        <label><input type="radio" name="p" value="腊子口"><span>腊子口</span></label>
        <label><input type="radio" name="p" value="吴起镇"><span>吴起镇</span></label>
      </fieldset>
      <p class="ln ln--o"><label for="an">画什么</label><textarea id="an" rows="2" maxlength="80" placeholder="不填也行。比如：夜里过河，只有一盏马灯"></textarea></p>
      <button class="go" type="submit"><span>画</span><i aria-hidden="true">→</i></button>
      <p class="err" id="err" role="alert"></p>
    </div>
  </form>

  <section class="out" id="out" hidden aria-live="polite">
    <div class="ld" id="ld">
      <svg viewBox="0 0 200 40" aria-hidden="true"><path pathLength="1" d="M2 30C40 4 60 38 100 20S160 6 198 14"/></svg>
      <p>正在构图。</p>
    </div>
    <figure class="art" id="art" hidden>
      <div class="art__f" id="artFig"></div>
      <figcaption><span id="artNote"></span>
        <small>AI 构思画面，由本站绘制，不是史料照片。</small></figcaption>
    </figure>
    <div class="qact" id="acts" hidden>
      <button class="btn" type="button" id="again">再画一张</button>
      <button class="btn" type="button" id="save">保存图片</button>
      <a class="btn" href="p5-follow.html">返回同行</a>
    </div>
  </section>
</main>
<script src="../assets/app.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/kb.js"></script>
<script src="../assets/xz.js"></script>
<script src="../assets/art.js"></script>
<script src="../assets/artgen.js"></script>
</body>
</html>
