<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机版预览 · 夜行</title>
<style>
  :root{--paper:#F8EFE8;--ink:#1B1814;--dim:#6F6659;--red:#B23A2E;--line:rgba(27,24,20,.16);
        --serif:"Songti SC","Noto Serif SC",serif;--sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        --mono:"SFMono-Regular",Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  header{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;
         padding:16px 28px;background:linear-gradient(180deg,var(--paper) 70%,rgba(248,239,232,0));border-bottom:1px solid var(--line)}
  header h1{margin:0;font:700 15px/1 var(--serif);letter-spacing:.06em}
  header h1 em{font:400 9px/1 var(--mono);font-style:normal;letter-spacing:.26em;color:var(--red);margin-left:10px;vertical-align:2px}
  header p{margin:0;font-size:11px;line-height:1.7;color:var(--dim)}
  header select{font:12px/1.4 var(--sans);padding:6px 10px;border:1px solid var(--line);background:#fffdf8;color:var(--ink)}
  .wrap{display:flex;gap:34px;align-items:flex-start;padding:26px 28px 60px;overflow-x:auto}
  figure{margin:0;flex:none}
  figcaption{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;
             font:9px/1.5 var(--mono);letter-spacing:.12em;color:var(--dim)}
  figcaption b{color:var(--red);font-weight:400}
  .device{border:1px solid rgba(27,24,20,.28);border-radius:22px;padding:8px;background:#fffdf8;
          box-shadow:0 26px 50px -34px rgba(27,24,20,.7)}
  .device.tall{border-radius:18px}
  iframe{display:block;border:0;border-radius:15px;background:var(--paper)}
  footer{padding:0 28px 40px;font:10px/1.9 var(--mono);color:var(--dim);letter-spacing:.02em}
  footer b{color:var(--ink);font-weight:400}
  @media(max-width:760px){header{padding:14px 16px}.wrap{padding:18px 16px 40px;gap:22px}footer{padding:0 16px 30px}}
</style>
</head>
<body>

<header>
  <h1>手机版预览<em>MOBILE PREVIEW</em></h1>
  <select id="pick" aria-label="选择要预览的页面">
    <option value="index.html">序章</option>
    <option value="pages/p1-journey.html">跋涉</option>
    <option value="pages/p2-faces.html">背影</option>
    <option value="pages/p3-objects.html">行装</option>
    <option value="pages/p4-numbers.html">丈量</option>
    <option value="pages/p5-follow.html">同行</option>
    <option value="pages/p6-spirit.html" selected>火种</option>
    <option value="pages/p7-comic.html">分镜</option>
    <option value="pages/p8-flame.html">天亮</option>
  </select>
  <p>下面三个窗口是<b>真实手机宽度</b>的渲染（不是缩小），可直接在窗口里上下滚动。</p>
</header>

<div class="wrap" id="wrap">
  <figure>
    <figcaption><span>iPhone 14</span><b>390 × 844</b></figcaption>
    <div class="device"><iframe width="390" height="844" title="iPhone 14 预览"></iframe></div>
  </figure>
  <figure>
    <figcaption><span>Android</span><b>360 × 800</b></figcaption>
    <div class="device"><iframe width="360" height="800" title="Android 预览"></iframe></div>
  </figure>
  <figure>
    <figcaption><span>iPad mini</span><b>768 × 1024</b></figcaption>
    <div class="device tall"><iframe width="768" height="1024" title="iPad 预览"></iframe></div>
  </figure>
</div>

<footer>
  <b>其它两种看法</b>　① 在真正的页面里按 F12 → 再按 Ctrl+Shift+M（手机图标）→ 选 iPhone 12 Pro。<br>
  ② 用手机看：电脑上启动一个本地服务，手机连同一个 WiFi，浏览器打开 <b>http://电脑IP:端口/pages/p6-spirit.html</b>。
</footer>

<script>
(function(){
  var pick=document.getElementById('pick'),frames=[].slice.call(document.querySelectorAll('iframe'));
  function load(){frames.forEach(function(f,i){f.src=pick.value+'?m='+(i+1);});}
  pick.addEventListener('change',load);load();
})();
</script>
</body>
</html>
